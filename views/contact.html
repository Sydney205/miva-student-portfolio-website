<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Me</title>
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <nav class="nav">
        <a class="brand" href="../index.html">DC</a>
        <div class="nav-links">
          <a href="../index.html">Home</a>
          <a href="about.html">About</a>
          <a href="project.html">Projects</a>
          <a href="academic-planner.html">Planner</a>
          <a href="contact.html">Contact</a>
        </div>
      </nav>
    </header>

    <main class="container">
      <div class="contact-box">
        <h1>Contact Me</h1>

        <form id="contact-form" novalidate>
          <div>
            <label for="name">Name</label>
            <input type="text" id="name" name="name" autocomplete="name" aria-describedby="name-error" required />
            <span id="name-error" class="field-error" aria-live="polite"></span>
          </div>

          <div>
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" autocomplete="email" aria-describedby="email-error" required />
            <span id="email-error" class="field-error" aria-live="polite"></span>
          </div>

          <div>
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" inputmode="numeric" autocomplete="tel" aria-describedby="phone-error" required />
            <span id="phone-error" class="field-error" aria-live="polite"></span>
          </div>

          <div>
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" aria-describedby="message-error" required></textarea>
            <span id="message-error" class="field-error" aria-live="polite"></span>
          </div>

          <button type="submit">Send Message</button>
          <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </main>

    <script src="../js/script.js"></script>
  </body>
</html>
