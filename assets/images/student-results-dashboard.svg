<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Student results dashboard concept</title>
  <desc id="desc">A dashboard with illustrative sample scores, a bar chart, and course filters.</desc>
  <rect width="900" height="520" fill="#e9e5dc"/><rect x="48" y="34" width="804" height="452" rx="6" fill="#fbfaf7"/>
  <rect x="48" y="34" width="804" height="58" rx="6" fill="#35483d"/><text x="82" y="70" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">COURSE RESULTS</text><text x="694" y="68" font-family="Arial,sans-serif" font-size="12" fill="#e5e8e1">TERM 1   ALL COURSES</text>
  <text x="82" y="130" font-family="Arial,sans-serif" font-size="12" fill="#656960">SAMPLE DATA / 48 STUDENTS</text>
  <rect x="82" y="151" width="220" height="78" rx="4" fill="#f0eee8"/><text x="101" y="178" font-family="Arial,sans-serif" font-size="12" fill="#656960">CLASS AVERAGE</text><text x="101" y="212" font-family="Georgia,serif" font-size="28" fill="#252923">72%</text>
  <rect x="318" y="151" width="220" height="78" rx="4" fill="#f0eee8"/><text x="337" y="178" font-family="Arial,sans-serif" font-size="12" fill="#656960">HIGHEST COURSE</text><text x="337" y="212" font-family="Georgia,serif" font-size="28" fill="#252923">Statistics</text>
  <rect x="554" y="151" width="220" height="78" rx="4" fill="#f0eee8"/><text x="573" y="178" font-family="Arial,sans-serif" font-size="12" fill="#656960">NEEDS REVIEW</text><text x="573" y="212" font-family="Georgia,serif" font-size="28" fill="#252923">Algebra</text>
  <text x="82" y="274" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#252923">Average score by course</text><line x1="105" y1="430" x2="774" y2="430" stroke="#c9c7bd"/>
  <rect x="156" y="333" width="76" height="97" fill="#b9664f"/><rect x="296" y="293" width="76" height="137" fill="#7f9a83"/><rect x="436" y="315" width="76" height="115" fill="#7f9a83"/><rect x="576" y="354" width="76" height="76" fill="#c99162"/><text x="145" y="454" font-family="Arial,sans-serif" font-size="12" fill="#656960">Algebra</text><text x="286" y="454" font-family="Arial,sans-serif" font-size="12" fill="#656960">Statistics</text><text x="436" y="454" font-family="Arial,sans-serif" font-size="12" fill="#656960">Biology</text><text x="575" y="454" font-family="Arial,sans-serif" font-size="12" fill="#656960">Writing</text>
</svg>
