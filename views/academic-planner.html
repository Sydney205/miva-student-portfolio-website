<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Academic Planner</title>
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <nav class="nav">
        <div class="brand">Dieke Syndey</div>
        <div class="nav-links">
          <a href="../index.html">Home</a>
          <a href="about.html">About</a>
          <a href="project.html">Projects</a>
          <a href="academic-planner.html">Planner</a>
          <a href="contact.html">Contact</a>
        </div>
      </nav>
    </header>

    <main class="container">
      <div class="planner-box">
        <h1>Academic Planner</h1>

        <p class="lead">Keep track of coursework and study plans. Tasks are saved in this browser.</p>
        <form id="task-form">
          <label class="visually-hidden" for="task-input">New academic task</label>
          <input type="text" id="task-input" placeholder="Add a new task" aria-describedby="planner-help" />
          <button class="add-btn" type="submit">Add Task</button>
        </form>
        <p id="planner-help" class="muted-note">Press Add Task, then check a task when it is complete.</p>

        <ul id="task-list" aria-live="polite"></ul>
      </div>
    </main>

    <script src="../js/script.js"></script>
  </body>
</html>
