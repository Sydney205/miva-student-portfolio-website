<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Monthly trends data story concept</title>
  <desc id="desc">A line chart showing illustrative monthly values alongside a short data note.</desc>
  <rect width="900" height="520" fill="#ece7df"/><rect x="48" y="34" width="804" height="452" rx="6" fill="#fbfaf7"/>
  <text x="86" y="82" font-family="Arial,sans-serif" font-size="12" letter-spacing="1.5" fill="#8e4f3e">DATA STORY / SAMPLE SERIES</text><text x="84" y="130" font-family="Georgia,serif" font-size="31" fill="#252923">A year in monthly change</text><text x="86" y="158" font-family="Arial,sans-serif" font-size="13" fill="#656960">Example values for practising a simple time-series chart</text>
  <line x1="116" y1="392" x2="680" y2="392" stroke="#8e8c83"/><line x1="116" y1="205" x2="116" y2="392" stroke="#8e8c83"/>
  <line x1="116" y1="345" x2="680" y2="345" stroke="#e0ded6"/><line x1="116" y1="298" x2="680" y2="298" stroke="#e0ded6"/><line x1="116" y1="251" x2="680" y2="251" stroke="#e0ded6"/><line x1="116" y1="204" x2="680" y2="204" stroke="#e0ded6"/>
  <polyline points="142,348 188,331 234,341 280,301 326,315 372,277 418,289 464,250 510,259 556,226 602,240 648,207" fill="none" stroke="#55725d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="142" cy="348" r="5" fill="#b9664f"/><circle cx="188" cy="331" r="5" fill="#b9664f"/><circle cx="234" cy="341" r="5" fill="#b9664f"/><circle cx="280" cy="301" r="5" fill="#b9664f"/><circle cx="326" cy="315" r="5" fill="#b9664f"/><circle cx="372" cy="277" r="5" fill="#b9664f"/><circle cx="418" cy="289" r="5" fill="#b9664f"/><circle cx="464" cy="250" r="5" fill="#b9664f"/><circle cx="510" cy="259" r="5" fill="#b9664f"/><circle cx="556" cy="226" r="5" fill="#b9664f"/><circle cx="602" cy="240" r="5" fill="#b9664f"/><circle cx="648" cy="207" r="5" fill="#b9664f"/>
  <text x="140" y="416" font-family="Arial,sans-serif" font-size="11" fill="#656960">Jan</text><text x="276" y="416" font-family="Arial,sans-serif" font-size="11" fill="#656960">Apr</text><text x="414" y="416" font-family="Arial,sans-serif" font-size="11" fill="#656960">Jul</text><text x="551" y="416" font-family="Arial,sans-serif" font-size="11" fill="#656960">Oct</text><text x="629" y="416" font-family="Arial,sans-serif" font-size="11" fill="#656960">Dec</text>
  <rect x="713" y="200" width="106" height="166" rx="4" fill="#f0eee8"/><text x="731" y="230" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#252923">WHAT TO ASK</text><text x="731" y="260" font-family="Arial,sans-serif" font-size="12" fill="#656960">Is the trend</text><text x="731" y="278" font-family="Arial,sans-serif" font-size="12" fill="#656960">steady, seasonal</text><text x="731" y="296" font-family="Arial,sans-serif" font-size="12" fill="#656960">or driven by</text><text x="731" y="314" font-family="Arial,sans-serif" font-size="12" fill="#656960">one unusual</text><text x="731" y="332" font-family="Arial,sans-serif" font-size="12" fill="#656960">month?</text>
  <text x="86" y="462" font-family="Arial,sans-serif" font-size="11" fill="#656960">Illustrative values only - no real-world conclusions</text>
</svg>
